[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-receptionist-api"
version = "0.1.0"
description = "Multi-tenant AI receptionist API"
requires-python = ">=3.11,<3.15"
dependencies = [
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain-core>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "opentelemetry-api>=1.45,<2",
  "opentelemetry-sdk>=1.45,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
  "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3",
  "SQLAlchemy>=2.0,<3",
  "structlog>=25,<26",
  "tzdata>=2025.2,<2027",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=16,<17",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"app.personal_agent" = ["prompt.txt"]
"app.personal_agent.voice" = ["friday_hi_boss.alaw"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/availability.py" = ["E501"]
"app/api/routes/bookings.py" = ["E501"]
"app/api/routes/patients.py" = ["E501"]
"app/services/schedule_generation.py" = ["E501"]
"app/agent/*" = ["E501"]
"app/integrations/*" = ["E501"]
"app/voice/*" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unused_configs = true
